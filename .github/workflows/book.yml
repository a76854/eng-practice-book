name: book

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24.3.0"

      - name: Install MyST CLI
        run: |
          npm i -g mystmd
          myst --version

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          pip install -e ".[book,dev]"

      - name: Register Jupyter kernel for MyST execution
        run: |
          python -m ipykernel install --user --name python3 --display-name "Python 3 (book)"
          python -m ipykernel install --user --name book-venv --display-name "book-venv"
          jupyter kernelspec list
          python -c "import fastapi; print('fastapi', fastapi.__version__)"

      - name: Build book (honest execution, log-gated)
        env:
          BASE_URL: /${{ github.event.repository.name }}
        run: |
          myst clean --execute -y
          myst build --html --execute --strict 2>&1 | tee /tmp/build.log
          ! grep -qE "⛔|Site has [1-9][0-9]* error" /tmp/build.log

      - name: Upload Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _build/html

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
