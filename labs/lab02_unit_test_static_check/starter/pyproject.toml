[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lab02-starter"
version = "0.1.0"
description = "Lab02 starter: unit test and static check demo"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = [
    "funasr.*",
    "torch.*",
    "torchaudio.*",
    "modelscope.*",
    "librosa.*",
    "soundfile.*",
    "numpy.*",
    "openai.*",
]
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests", "starter"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-q"
