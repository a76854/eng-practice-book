# Lab08 starter: 最小两服务编排（hermetic，可用 yaml.safe_load 校验）
# 后端在 :8000，前端用 nginx:alpine 托管静态页在 :80
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DOCSEARCH_DATA_DIR: /data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: "no"
    ports:
      - "8000:8000"

  frontend:
    image: nginx:alpine
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: "no"
