[project]
name = "eng-practice-book"
version = "0.1.0"
description = "《python编程工程实践》教科书构建配置"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
book = [
    "nbclient==0.11.0",
    "ipykernel==7.3.0",
    "jupyter-client==8.10.0",
    "jupyter-server==2.21.0",
    "PyYAML==6.0.3",
    "fastapi==0.141.1",
    "PyJWT==2.13.0",
    "sqlalchemy==2.0.52",
    "httpx>=0.27",
    "httpx2",
    "requests>=2.32",
    "pytest>=9.0",
    "tavily-python>=0.6",
    "boto3>=1.35",
    "moto[s3]>=5.0",
    "fakeredis>=2.26",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
    "mypy>=1.10",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
ignore_missing_imports = false
strict = false