[project]
name = "m2t"
version = "0.1.0"
description = "MeetingToText 教学辅助包（d2l 风格精简实现）"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "requests>=2.34.2",
    "soundfile>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
    "mypy>=1.10",
    "httpx>=0.27",
    "openai>=1.0",
]
asr = [
    "funasr>=1.2.0",
    "torch>=2.5.0",
    "torchaudio>=2.0.0",
    "modelscope>=1.22.0",
    "librosa>=0.10.0",
    "onnxruntime>=1.6.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["m2t"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
ignore_missing_imports = false
strict = false

[[tool.mypy.overrides]]
module = [
    "funasr.*",
    "torch.*",
    "torchaudio.*",
    "modelscope.*",
    "librosa.*",
    "soundfile.*",
    "numpy.*",
    "openai.*",
]
ignore_missing_imports = true
