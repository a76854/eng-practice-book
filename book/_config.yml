# Configuration for Jupyter Book 1.x
# See https://jupyterbook.org/customize/config.html
title: 算法编程与工程实践
author: huiguo
language: zh

repository:
  url: https://github.com/example/eng-practice-book
  branch: main

only_build_toc_files: true

execute:
  execute_notebooks: force
  timeout: 120

parse:
  myst_enable_extensions:
    - colon_fence
    - dollarmath
    - linkify
    - substitution
    - tasklist

sphinx:
  config:
    language: zh

html:
  use_issues_button: true
  use_repository_button: true
