<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>文档搜索</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: #eef2f6; color: #1f2328; padding: 48px 24px; }
    .app { max-width: 560px; margin: 0 auto; background: #ffffff; border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.06); overflow: hidden; }
    .header { padding: 20px 24px; border-bottom: 1px solid #eef0f3; }
    .header h1 { font-size: 18px; font-weight: 600; }
    .header p { font-size: 13px; color: #7a828c; margin-top: 4px; }
    .header code { background: #f2f4f7; padding: 1px 6px; border-radius: 4px; font-size: 12px; }
    .result { padding: 16px 24px; border-bottom: 1px solid #eef0f3; }
    .result:last-child { border-bottom: none; }
    .result a { font-size: 15px; font-weight: 600; color: #1a56db; text-decoration: none; }
    .result a:hover { text-decoration: underline; }
    .source { display: inline-block; font-size: 12px; color: #9aa3ae; margin-top: 4px; }
    .result p { font-size: 13px; color: #565d66; margin-top: 6px; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <h1>文档搜索</h1>
      <p>来自 <code>GET /api/search?q=pydantic</code> 的搜索数据</p>
    </div>
    <ul id="results" style="list-style: none;"></ul>
  </div>

  <script>
    // 模拟后端 GET /api/search?q=pydantic 返回的 JSON（前后端分离下，前端拿到的就是这份数据）
    const mockResults = [
      { title: "Models - Pydantic", url: "https://docs.pydantic.dev/latest/concepts/models/", source: "docs.pydantic.dev", content: "模型是继承 BaseModel 的类，负责校验并转换输入。" },
      { title: "Fields - Pydantic", url: "https://docs.pydantic.dev/latest/concepts/fields/", source: "docs.pydantic.dev", content: "Field 附加约束，校验失败抛出 ValidationError。" },
      { title: "Validators - Pydantic", url: "https://docs.pydantic.dev/latest/concepts/validators/", source: "docs.pydantic.dev", content: "field_validator 校验单字段，model_validator 校验整个模型。" }
    ];

    // 前端把 JSON 渲染成结果列表：一处一处手动牵线
    const list = document.getElementById("results");
    for (const r of mockResults) {
      const li = document.createElement("li");
      li.className = "result";

      const a = document.createElement("a");
      a.href = r.url;
      a.target = "_blank";
      a.textContent = r.title;

      const src = document.createElement("span");
      src.className = "source";
      src.textContent = " · " + r.source;

      const p = document.createElement("p");
      p.textContent = r.content;

      li.appendChild(a);
      li.appendChild(src);
      li.appendChild(p);
      list.appendChild(li);
    }
  </script>
</body>
</html>
